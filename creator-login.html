<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灯塔海</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#14172b;overflow:hidden}

  /* ---------- 背景：灯塔海景 ---------- */
  .bg{position:fixed;inset:0;overflow:hidden}
  .scene{
    position:absolute;inset:-3%;
    background:url("login-lighthouse.jpg") center 38%/cover no-repeat;
    animation:kenburns 32s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes kenburns{
    from{transform:scale(1) translate(0,0)}
    to{transform:scale(1.09) translate(-1.4%,1%)}
  }
  /* 轻压暗四周 */
  .bg::after{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(180deg,rgba(13,15,34,.28) 0%,rgba(13,15,34,0) 26%,rgba(13,15,34,0) 66%,rgba(13,15,34,.35) 100%);
  }
  /* 灯塔灯光呼吸辉光 */
  .lamp{
    position:absolute;left:calc(39.5% - 110px);top:calc(27% - 110px);width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,190,110,.55),rgba(255,160,70,.18) 45%,transparent 70%);
    filter:blur(8px);animation:lampPulse 3.6s ease-in-out infinite;pointer-events:none;
  }
  @keyframes lampPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
  /* 旋转扫射光束 */
  .beams{position:absolute;left:39.5%;top:27%;width:0;height:0;pointer-events:none;mix-blend-mode:screen}
  .beam{
    position:absolute;left:0;top:0;width:58vmax;height:26vmax;
    transform-origin:0 50%;
    background:linear-gradient(90deg,rgba(255,214,150,.5),rgba(255,190,110,.14) 42%,transparent 76%);
    clip-path:polygon(0 50%,100% 0,100% 100%);
    filter:blur(12px);opacity:.8;
    animation:sweep 9s ease-in-out infinite alternate;
  }
  .beam-b{width:44vmax;height:20vmax;opacity:.55;animation:sweep2 13s ease-in-out infinite alternate}
  @keyframes sweep{from{transform:rotate(-40deg)}to{transform:rotate(4deg)}}
  @keyframes sweep2{from{transform:rotate(-8deg)}to{transform:rotate(-46deg)}}
  /* 海面摇曳倒影 */
  .glint{
    position:absolute;left:calc(39.5% - 55px);top:62%;width:110px;height:34%;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,170,90,.5),rgba(255,150,70,.16) 55%,transparent);
    filter:blur(10px);mix-blend-mode:screen;
    animation:glintSway 7s ease-in-out infinite alternate;
  }
  @keyframes glintSway{
    0%{opacity:.65;transform:skewX(-3deg) scaleX(1)}
    50%{opacity:.95}
    100%{opacity:.6;transform:skewX(4deg) scaleX(.88)}
  }
  /* 波光流动 */
  .waves{
    position:absolute;left:-12%;right:-12%;bottom:0;height:38%;pointer-events:none;
    background:
      repeating-linear-gradient(96deg,rgba(255,200,140,.05) 0 3px,transparent 3px 34px),
      repeating-linear-gradient(85deg,rgba(255,225,190,.045) 0 2px,transparent 2px 52px);
    mix-blend-mode:screen;filter:blur(2px);
    mask-image:linear-gradient(180deg,transparent,rgba(0,0,0,.8) 40%);
    -webkit-mask-image:linear-gradient(180deg,transparent,rgba(0,0,0,.8) 40%);
    animation:waveFlow 11s linear infinite alternate;
  }
  @keyframes waveFlow{from{transform:translateX(-2.5%)}to{transform:translateX(2.5%)}}
  /* 海面星光粒子 */
  .spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffd9a0;
    box-shadow:0 0 8px 2px rgba(255,200,130,.55);opacity:0;animation:twinkle 5s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:0;transform:translateY(0)}45%{opacity:.9}60%{opacity:0;transform:translateY(-14px)}}
  .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;will-change:transform}
  .orb-a{width:520px;height:520px;left:-140px;top:-120px;background:radial-gradient(circle,#5a4a9e,transparent 65%);animation:drift 16s ease-in-out infinite alternate}
  .orb-b{width:460px;height:460px;right:-120px;bottom:-140px;background:radial-gradient(circle,#8a5a3a,transparent 65%);animation:drift 20s ease-in-out infinite alternate-reverse}
  @keyframes drift{
    from{transform:translate(0,0) scale(1)}
    to{transform:translate(60px,40px) scale(1.12)}
  }

  @media (max-width:900px){
    .lamp{left:calc(50% - 75px);top:calc(24% - 75px);width:150px;height:150px}
    .beams{left:50%;top:24%}
    .glint{left:calc(50% - 40px);width:80px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="scene"></div>
  <div class="beams">
    <div class="beam"></div>
    <div class="beam beam-b"></div>
  </div>
  <div class="lamp"></div>
  <div class="glint"></div>
  <div class="waves"></div>
  <div class="spark" style="left:30%;top:64%;animation-delay:.2s"></div>
  <div class="spark" style="left:38%;top:74%;animation-delay:1.4s"></div>
  <div class="spark" style="left:47%;top:69%;animation-delay:2.6s"></div>
  <div class="spark" style="left:55%;top:78%;animation-delay:.8s"></div>
  <div class="spark" style="left:63%;top:66%;animation-delay:3.4s"></div>
  <div class="spark" style="left:70%;top:82%;animation-delay:2s"></div>
  <div class="spark" style="left:24%;top:80%;animation-delay:4.2s"></div>
  <div class="spark" style="left:80%;top:72%;animation-delay:1s"></div>
  <div class="orb orb-a"></div><div class="orb orb-b"></div>
</div>

</body>
</html>
