<script>
(function(){
"use strict";
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ===== Tab 切换（支持 #hash 直达） ===== */
var tabs=document.querySelectorAll('.tab');
function show(t){
  tabs.forEach(function(b){b.classList.toggle('on',b.dataset.t===t);});
  ['cheats','codes','places'].forEach(function(k){document.getElementById('pane-'+k).hidden=(k!==t);});
}
tabs.forEach(function(b){b.addEventListener('click',function(){location.hash=b.dataset.t;show(b.dataset.t);});});
var h=(location.hash||'').replace('#','');
if(['cheats','codes','places'].indexOf(h)>=0) show(h);
window.addEventListener('hashchange',function(){var h=location.hash.replace('#','');if(['cheats','codes','places'].indexOf(h)>=0)show(h);});

/* ===== 秘籍 ===== */
var plat='ps',cat='全部',q='',favs={};
try{favs=JSON.parse(localStorage.getItem('sngz-cheat-favs')||'{}');}catch(e){}
var cats=['全部'];CHEATS.forEach(function(c){if(cats.indexOf(c.cat)<0)cats.push(c.cat);});
var chipBox=document.getElementById('cheat-chips');
chipBox.innerHTML=cats.map(function(c){return '<button class="chip'+(c==='全部'?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>';}).join('');
chipBox.addEventListener('click',function(e){
  var b=e.target.closest('.chip');if(!b)return;
  cat=b.dataset.c;
  chipBox.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x===b);});
  render();
});
document.getElementById('plat').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  plat=b.dataset.p;
  document.querySelectorAll('#plat button').forEach(function(x){x.classList.toggle('on',x===b);});
  render();
});
document.getElementById('q-cheats').addEventListener('input',function(){q=this.value.trim();render();});
function keysHtml(seq){
  if(!seq)return '<span class="none">无按键组合 · 靠解锁条件触发 ↓</span>';
  return seq.split(' ').map(function(k){return '<kbd>'+esc(plat==='xbox'?(XMAP[k]||k):k)+'</kbd>';}).join('');
}
function render(){
  var list=CHEATS.filter(function(c){
    return (cat==='全部'||c.cat===cat)&&(!q||c.name.indexOf(q)>=0||(c.unlock||'').indexOf(q)>=0);
  });
  document.getElementById('cheat-cnt').textContent='显示 '+list.length+' / '+CHEATS.length+' 条 · 已收藏 '+Object.keys(favs).length+' 条';
  document.getElementById('cheat-grid').innerHTML=list.map(function(c,i){
    var id=esc(c.name);
    return '<article class="cheat"><button class="fav'+(favs[id]?' on':'')+'" data-f="'+esc(c.name)+'" aria-label="收藏">'+(favs[id]?'★':'☆')+'</button>'+
      '<span class="cat">'+esc(c.cat)+'</span><b>'+esc(c.name)+'</b>'+
      '<div class="keys">'+keysHtml(c.ps)+'</div>'+
      '<p class="unlock"><em>解锁：</em>'+esc(c.unlock||'—')+'</p></article>';
  }).join('');
}
document.getElementById('cheat-grid').addEventListener('click',function(e){
  var b=e.target.closest('.fav');if(!b)return;
  var id=b.dataset.f;
  if(favs[id])delete favs[id];else favs[id]=1;
  try{localStorage.setItem('sngz-cheat-favs',JSON.stringify(favs));}catch(err){}
  render();
});

render();

/* ===== 密码 ===== */
var box=document.getElementById('codes-box');
var NOTE={0:'剧情任务里遇到的密码固定不变，可以直接照抄。',1:'抢劫非法据点时的保险箱密码，可能因人而异。',2:'散落在世界里的保险箱、电脑与车库门，部分带解谜线索。'};
box.innerHTML=CODES.map(function(tb,ti){
  var head=tb.head,rows=tb.rows;
  return '<h2 class="sect">'+esc(head)+'</h2><p class="sectnote">'+esc(NOTE[ti]||'')+'</p>'+
  '<table class="tbl"><thead><tr>'+tb.cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>'+
  rows.map(function(r){
    return '<tr>'+r.map(function(cell,ci){
      var star=cell.indexOf('*')>=0;
      return '<td'+(ci===0?' class="cp" title="点击复制"':'')+(star?' style="color:#FFB020"':'')+'>'+esc(cell)+'</td>';
    }).join('')+'</tr>';
  }).join('')+'</tbody></table>';
}).join('');
box.addEventListener('click',function(e){
  var td=e.target.closest('td.cp');if(!td)return;
  var code=td.textContent.replace(/\*$/,'');
  function done(){var o=td.textContent;td.textContent='✓ 已复制';setTimeout(function(){td.textContent=o;},900);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done,function(){prompt('手动复制：',code);});}
  else prompt('手动复制：',code);
});

/* ===== 地点 ===== */
var pcs=['全部'];PLACES.forEach(function(p){if(pcs.indexOf(p.c)<0)pcs.push(p.c);});
var pcBox=document.getElementById('place-chips');
pcBox.innerHTML=pcs.map(function(c){return '<button class="chip'+(c==='全部'?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>';}).join('');
function pr(){
  var cur=pcBox.querySelector('.chip.on').dataset.c;
  var list=PLACES.filter(function(p){return cur==='全部'||p.c===cur;});
  document.getElementById('place-grid').innerHTML=list.map(function(p){
    return '<article class="place"><span class="pc">'+esc(p.c)+'</span><b>'+esc(p.n)+'</b><p>'+esc(p.d)+'</p>'+
      (p.l?'<p class="rel">关联阅读：'+esc(p.l)+'</p>':'')+'</article>';
  }).join('');
}
pcBox.addEventListener('click',function(e){
  var b=e.target.closest('.chip');if(!b)return;
  pcBox.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x===b);});
  pr();
});
pr();
})();
</script>
</body>
